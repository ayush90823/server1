name: run-bot
on:
  workflow_dispatch:

concurrency:
  group: bot
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Install ffmpeg (video details ke liye)
        run: |
          which ffprobe || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          ffprobe -version | head -1
      - name: Start Cloudflare quick tunnel
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          nohup ./cloudflared tunnel --url http://localhost:8000 > tunnel.log 2>&1 &
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[-a-z0-9]*\.trycloudflare\.com' tunnel.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done
          [ -z "$URL" ] && { echo "Tunnel URL nahi mila"; cat tunnel.log; exit 1; }
          echo "ORIGIN_URL=$URL" >> $GITHUB_ENV
      - name: Run bot
        run: python main.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          STORAGE_CHANNEL: ${{ secrets.STORAGE_CHANNEL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ALLOWED_USERS: ${{ secrets.ALLOWED_USERS }}
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          BASE_URL: https://proud-moon-7329.ayushkum099766.workers.dev
          PORT: "8000"

          
